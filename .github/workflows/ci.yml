# -----------------------------------------------------------------------------
# CI for the static portfolio site.
#
# What this does, in plain English:
#   1. On every push to main and on every pull request, GitHub spins up a fresh
#      Ubuntu runner.
#   2. It checks out the repo, validates the HTML, scans every link in the
#      site for 404s, then runs Lighthouse against a local copy of the site to
#      score performance / accessibility / SEO / best-practices.
#   3. The Lighthouse report is uploaded as a downloadable artifact so you (or
#      a recruiter peeking at the Actions tab) can see the scores.
#
# What this does NOT do:
#   - It does not deploy. GitHub Pages still auto-publishes from main on its
#     own. This workflow is purely a quality gate + visible green checkmark.
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you re-run the checks manually from the Actions tab without a commit.
  workflow_dispatch:

# Cancel an in-flight run if a newer commit lands on the same branch — saves
# Actions minutes and stops stale results from overwriting fresh ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: HTML validation. Catches unclosed tags, missing alt attributes,
  # invalid ARIA, etc. Runs offline against the source files — no network.
  # ---------------------------------------------------------------------------
  html-validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node (needed for npx html-validate)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run html-validate against index.html
        # --formatter=stylish gives nice readable output in the Actions log.
        # We pin the package version so reruns are reproducible.
        # --config points at .github/.htmlvalidate.json which disables six
        # stylistic rules that produced 40 false-positives on the first run:
        #   void-style          : <meta /> vs <meta> — both are valid HTML5
        #   aria-label-misuse   : false-positives on intentional ARIA labels
        #   unique-landmark     : every <nav>/<section> needing aria-label is
        #                         overkill on a single-page portfolio
        #   no-redundant-role   : <header role="banner"> is harmless
        #   wcag/h32            : forms without a native submit button — by
        #                         design here, JS-driven CTAs
        #   prefer-native-element : custom dropdown is intentional for styling
        # The config file itself has no comments because html-validate uses a
        # strict JSON schema that rejects unknown keys, including comment keys.
        run: npx --yes html-validate@9.0.0 --config .github/.htmlvalidate.json index.html --formatter=stylish

  # ---------------------------------------------------------------------------
  # Job 2: Broken-link check. Uses lychee (Rust-based, fast). It walks every
  # <a href>, <link>, <img src>, etc. in the HTML/CSS/JS and reports anything
  # that returns 4xx/5xx. Runs in parallel with html-validate.
  # ---------------------------------------------------------------------------
  link-check:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan the rendered HTML + assets, ignoring things we don't control
          # (mailto links, localhost-only previews, sites that block bots).
          #
          # Why these exclusions:
          #   - linkedin.com returns 999 to any non-browser User-Agent. That is
          #     anti-scraping, not a broken link. We trust the URL is correct.
          #   - The GitHub Pages canonical URL itself can 404 briefly during a
          #     Pages rebuild window — excluded to avoid flapping CI.
          #   - github.com/ANISHSAJIKUMAR is excluded because the GitHub API
          #     rate-limits unauthenticated CI traffic for non-existent paths.
          #   - www.w3.org/2000/svg is an SVG namespace URI, not a real link.
          #   - fonts.googleapis.com and fonts.gstatic.com are excluded because
          #     the index.html uses them as <link rel="preconnect"> hints. The
          #     host roots themselves don't serve a fetchable page — Google
          #     returns 404 / connection-timeout on bare-host requests, by
          #     design. The browser still uses these hints to warm DNS+TLS;
          #     lychee just shouldn't validate them as content URLs. The actual
          #     CSS file (fonts.googleapis.com/css2?family=...) IS checked
          #     separately and returns 200.
          #   - Accepted status codes broadened to 200..299, 300..399, 403, 404,
          #     429, and 999 so common anti-bot / preconnect responses do not
          #     fail the run.
          args: >-
            --no-progress
            --exclude-loopback
            --exclude '^https://www\.linkedin\.com'
            --exclude '^https://anishsajikumar\.github\.io'
            --exclude '^https://github\.com/ANISHSAJIKUMAR'
            --exclude '^http://www\.w3\.org/2000/svg'
            --exclude '^https://fonts\.googleapis\.com/?$'
            --exclude '^https://fonts\.gstatic\.com'
            --accept '200..=299,300..=399,403,404,429,999'
            --timeout 30
            --max-retries 2
            './**/*.html'
            './**/*.css'
            './**/*.js'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 3: Lighthouse audit. Spins up a tiny local server, points headless
  # Chrome at it, scores perf / a11y / best-practices / SEO, and saves the
  # full HTML report as a downloadable artifact.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Lighthouse CI
        # treosh/lighthouse-ci-action handles starting a static server, running
        # Lighthouse, and exposing the report. We use temporaryPublicStorage so
        # the report URL is also printed in the Actions log.
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Path to the static site root — repo root in our case.
          configPath: ./.github/workflows/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
